<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Kwarran Rajeg Official</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 20px 30px;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            font-size: 24px;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
        }

        .welcome h2 {
            margin-bottom: 10px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-top: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .card h3 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .card p {
            color: #777;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Dashboard Admin</h1>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Selamat Datang 👋</h2>

            <p>
                Selamat datang di Dashboard Admin
                Kwarran Rajeg Official.
            </p>

            <img
                src="logo.jpg"
                alt="Logo Kwarran Rajeg"
                class="logo"
            >
        </div>

        <div class="cards">

            <div class="card">
                <h3>0</h3>
                <p>Total Berita</p>
            </div>

            <div class="card">
                <h3>0</h3>
                <p>Total Kegiatan</p>
            </div>

            <div class="card">
                <h3>0</h3>
                <p>Total Anggota</p>
            </div>

            <div class="card">
                <h3>0</h3>
                <p>Total Galeri</p>
            </div>

        </div>

        <a href="login.html" class="back">
            Kembali ke Login
        </a>

    </div>

</body>
</html>
